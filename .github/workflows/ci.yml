name: OpenMRS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release version bump'
        type: choice
        options: [patch, minor, major]
        default: patch
      custom_version:
        description: 'Custom version (e.g. 12.5.0). If set, overrides the version bump above.'
        required: false
      publish_only:
        description: 'Re-Publish only (For recovering from a failed npm publish. Skips the version bump, commit, and tag. Set "Custom version" to the existing release version, e.g. 12.4.0.)'
        type: boolean
        default: false
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: openmrs/openmrs-contrib-gha-workflows/.github/workflows/build-frontend-module.yml@main
    with:
      node_version: '20'
      build_command: 'yarn build:lib'
      verify_command: 'yarn lint && yarn test'
      artifact_path: 'dist/ngx-formentry'

  release:
    needs: build
    uses: openmrs/openmrs-contrib-gha-workflows/.github/workflows/release-frontend-module.yml@main
    with:
      node_version: '20'
      build_command: 'yarn build:lib'
      verify_command: 'yarn lint && yarn test'
      pre_release_version_command: 'yarn workspace @openmrs/ngx-formentry version "$PRERELEASE_VERSION"'
      release_version_command: 'yarn version "$RELEASE_VERSION" && yarn workspace @openmrs/ngx-formentry version "$RELEASE_VERSION"'
      pre_release_publish_command: 'cd dist/ngx-formentry && npm publish --tag next --access public'
      release_publish_command: 'cd dist/ngx-formentry && npm publish --tag latest --access public'
      artifact_path: 'dist/ngx-formentry'
      trigger_refapp_build: false
      release_type: ${{ inputs.release_type }}
      release_version: ${{ inputs.custom_version }}
      publish_only: ${{ inputs.publish_only || false }}
    secrets:
      NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
      BOT_PAT: ${{ secrets.OMRS_BOT_GH_TOKEN }}
